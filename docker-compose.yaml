services:
  liteblox:
    image: ghcr.io/dorkbrain/liteblox:latest   # amd64 + arm64; pin a version (e.g. :4.7) to upgrade on your own schedule
    container_name: liteblox
    restart: unless-stopped
    user: "1000:1000"          # ./data and ./backups must be owned by uid 1000
    # userns_mode: "keep-id"   # rootless podman only: uncomment to keep the folders owned by you
    environment:
      - TZ=America/Detroit
      # - FORWARDED_ALLOW_IPS=192.168.1.x   # reverse proxy address, if any (its docker network's gateway if it runs on this host)
    volumes:
      - ./data:/data
      - ./backups:/backups
      #- liteblox-backups:/backups   # or keep node backups on the NAS
    ports:
      - "53530:53530"
      - "53443:53443"   # HTTPS, once it's on in Settings → HTTPS
    healthcheck:   # the image is OCI format, which drops the Dockerfile HEALTHCHECK
      test: liteblox healthcheck   # string form: podman-compose 1.0.x mangles the exec array form
      interval: 30s
      timeout: 3s

