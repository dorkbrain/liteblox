[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liteblox"
dynamic = ["version"]
description = "Web console for dual-master BIND9 DNS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "pydantic>=2.7",
    "dnspython>=2.6",
    "cryptography>=42",
    "httpx>=0.27",
    "paramiko>=3.4",
    "markdown>=3.6",
]

[project.scripts]
liteblox = "liteblox.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

# VERSION at the repo root is the single source of truth (shared with deploy/)
[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\d+\\.\\d+\\.\\d+)"

[tool.hatch.build.targets.wheel]
packages = ["liteblox"]

# the node agent ships inside the package so bootstrap can copy it to nodes
[tool.hatch.build.targets.wheel.force-include]
"agent" = "liteblox/_agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
# starlette wants httpx2 for its TestClient; the app itself uses httpx (nodes/client.py), so tests stay on it for now
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
